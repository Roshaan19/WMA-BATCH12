<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Experience</title>

</head>

<body style="margin: 0; color: white; font-family: Arial;">

    <video autoplay muted loop style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">

        <source src="./assets/videos/16794873_1920_1080_24fps.mp4" type="video/mp4">

    </video>

    <form style="width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center;">

        <fieldset style="background-color: rgba(0, 0, 0, 0.75); width: 400px; padding: 20px; border-radius: 10px; border: 2px solid white;">

            <h1 align="center">Work Experience</h1>

            <p style="text-align: center;">Please enter your work experience details.</p>

            <label for="job-title">Current Job Title:</label>

            <input type="text" id="job-title" name="job-title" placeholder="Enter your current job title" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="years">Years of Experience:</label>

            <input type="number" id="years" name="years" placeholder="Enter years of experience" min="0" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="start-date">Employment Start Date:</label>

            <input type="month" id="start-date" name="start-date" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="resume">Upload Resume:</label>

            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="skills">Skills:</label>

            <input type="text" id="skills" name="skills" placeholder="Enter your skills" list="skill-list" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <datalist id="skill-list">

                <option value="HTML">

                <option value="CSS">

                <option value="UI/UX Design">

                <option value="Communication">

                <option value="Web Development">

            </datalist>

            <br><br>

            <a href="./signup2.html" style="text-align: center; width: 50%; border-radius: 5px; padding: 10px; border: 1px solid #ccc; color: white; cursor: pointer; display: block; margin: auto; text-decoration: none;">Back</a>

            <br>

            <a href="./signup4.html" style="text-align: center; width: 50%; border-radius: 5px; padding: 10px; border: 1px solid #ccc; color: white; cursor: pointer; display: block; margin: auto; text-decoration: none;">Next</a>

        </fieldset>

    </form>

</body>

</html>
