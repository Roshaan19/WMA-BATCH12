<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>

</head>

<body style="margin: 0; color: white; font-family: Arial;">

    <video autoplay muted loop style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">

        <source src="./assets/videos/16794873_1920_1080_24fps.mp4" type="video/mp4">

    </video>

    <form style="width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center;">

        <fieldset style="background-color: rgba(0, 0, 0, 0.75); width: 400px; padding: 20px; border-radius: 10px; border: 2px solid white;">

            <h1 align="center">Contact Information</h1>

            <p style="text-align: center;">Please enter your contact information.</p>

            <label for="phone">Phone Number:</label>

            <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="country">Country:</label>

            <input type="text" id="country" name="country" placeholder="Enter your Country" list="countries" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <datalist id="countries">

                <option value="United States">

                <option value="Canada">

                <option value="United Kingdom">

                <option value="Australia">

                <option value="Pakistan">

                <option value="India">

                <option value="China">

                <option value="Japan">

                <option value="Germany">

                <option value="Saudi Arabia">

                <option value="Egypt">

                <option value="France">

            </datalist>

            <br><br>

            <label for="address">Address:</label>

            <input type="text" id="address" name="address" placeholder="Enter your Address" required style="width: 90%; height: auto; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

            <br><br>

            <label for="contact-method">Preferred Contact Method:</label>

            <select name="contact-method" id="contact-method" required style="width: 97%; border-radius: 5px; padding: 10px; border: 1px solid #ccc;">

                <option value="">Select a contact method</option>

                <option value="Email">Email</option>

                <option value="Phone">Phone</option>

                <option value="SMS">SMS</option>

            </select>

            <br><br>

            <input type="checkbox" id="terms" name="terms" required>

            <label for="terms">I agree to the terms and conditions.</label>

            <br><br>

            <a href="./signup1.html" style="text-align: center; width: 50%; border-radius: 5px; padding: 10px; border: 1px solid #ccc; color: white; cursor: pointer; display: block; margin: auto; text-decoration: none;">Back</a>

            <br>

            <a href="./signup3.html" style="text-align: center; width: 50%; border-radius: 5px; padding: 10px; border: 1px solid #ccc; color: white; cursor: pointer; display: block; margin: auto; text-decoration: none;">Next</a>

        </fieldset>

    </form>
</body>

</html>
